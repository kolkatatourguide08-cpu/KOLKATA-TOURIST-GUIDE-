  <style>
/* INTERNAL CSS: css/style.css */
css
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;

  font-family: Arial, Helvetica, sans-serif;

  background: #090d14;

  color: #f5f7fb;

  position: relative;

  min-height: 100vh;
}


/* ================================
   GLOBAL KOLKATA BACKGROUND
   IMAGE LINK UNCHANGED
================================ */

body::before {
  content: "";

  position: fixed;

  inset: 0;

  z-index: -2;

  background:
    linear-gradient(
      rgba(4, 8, 15, 0.16),
      rgba(4, 8, 15, 0.22)
    ),
    url("https://images.pexels.com/photos/16569842/pexels-photo-16569842.jpeg")
    center center / cover no-repeat;

  pointer-events: none;
}


/* ================================
   TOP BAR
================================ */

.topbar {
  height: 58px;

  background: rgba(17, 26, 39, 0.30);

  backdrop-filter: blur(14px) saturate(115%);
  -webkit-backdrop-filter: blur(14px) saturate(115%);

  border-bottom: 1px solid rgba(255, 255, 255, 0.16);

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 5%;

  position: sticky;

  top: 0;

  z-index: 20;
}


.brand {
  font-weight: 800;

  font-size: 18px;
}


.brand span {
  color: #0b5bee;
}


.brand small {
  display: block;

  color: #e22a32;

  font-size: 9px;

  font-style: italic;

  margin-left: 25px;
}


/* ================================
   BUTTONS
================================ */

.icon-btn,
.secondary,
.primary {
  border: 1px solid rgba(255, 255, 255, 0.18);

  border-radius: 14px;

  background: rgba(255, 255, 255, 0.07);

  color: inherit;

  padding: 11px 17px;

  cursor: pointer;

  transition: 0.2s ease;

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}


.icon-btn:hover,
.secondary:hover {
  border-color: #3478f6;

  background: rgba(255, 255, 255, 0.12);

  transform: translateY(-1px);
}


.primary {
  background: #2169ee;

  border-color: #2169ee;

  color: white;

  font-weight: 700;
}


.primary:hover {
  background: #3478f6;
}


/* ================================
   HERO
   IMAGE LINK UNCHANGED
================================ */

.hero {
  min-height: 475px;

  background:
    linear-gradient(
      90deg,
      rgba(3, 7, 12, 0.28),
      rgba(3, 7, 12, 0.08)
    ),
    url("https://images.pexels.com/photos/16569842/pexels-photo-16569842.jpeg")
    center / cover no-repeat;

  display: flex;

  align-items: center;

  position: relative;
}


.hero-overlay {
  max-width: 900px;

  width: 90%;

  margin: auto;
}


.eyebrow {
  color: #2e73f2;

  font-weight: 800;

  letter-spacing: 2px;

  font-size: 12px;
}


.hero h1 {
  font-size: 64px;

  line-height: 0.98;

  margin: 10px 0 20px;
}


.hero p:not(.eyebrow) {
  max-width: 610px;

  color: #e0e5ec;

  line-height: 1.5;
}


/* ================================
   SEARCH
================================ */

.search {
  background: rgba(255, 255, 255, 0.88);

  border-radius: 16px;

  padding: 5px;

  display: flex;

  max-width: 590px;

  margin-top: 28px;

  box-shadow:
    0 12px 35px rgba(0, 0, 0, 0.16);
}


.search input {
  flex: 1;

  outline: 0;

  padding: 16px;

  background: transparent;

  font-size: 15px;
}


.search button {
  border: 0;

  border-radius: 12px;

  background: #2169ee;

  color: white;

  padding: 0 24px;

  font-weight: 700;

  cursor: pointer;
}


/* ================================
   PLACES SECTION
================================ */

.places-section {
  max-width: 1000px;

  margin: 55px auto;

  padding: 0 25px;
}


.places-section h2 {
  font-size: 30px;
}


/* ================================
   PLACE GRID
================================ */

.place-grid {
  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 16px;
}


/* ================================
   PLACE CARD
   GLASSMORPHISM
================================ */

.place-tile {
  background: rgba(255, 255, 255, 0.07);

  border: 1px solid rgba(255, 255, 255, 0.18);

  border-radius: 16px;

  overflow: hidden;

  cursor: pointer;

  transition: 0.2s ease;

  backdrop-filter: blur(12px) saturate(115%);
  -webkit-backdrop-filter: blur(12px) saturate(115%);

  box-shadow:
    0 12px 35px rgba(0, 0, 0, 0.16),
    inset 0 1px 0 rgba(255, 255, 255, 0.10);
}


.place-tile:hover {
  transform: translateY(-3px);

  border-color: #3478f6;

  background: rgba(255, 255, 255, 0.10);
}


/* ================================
   PLACE IMAGE
================================ */

.place-img {

  padding: 0;

  overflow: hidden;
}


.place-img img {

  display: block;

  object-fit: cover;
}


/* ================================
   PLACE TEXT
================================ */

  margin: 15px 14px 6px;
}


.place-tile p {
  font-size: 13px;

  color: #d0d8e4;

  margin: 0 14px 16px;

  line-height: 1.5;
}


/* ================================
   FOOTER
================================ */

footer {
  text-align: center;

  color: #b0bac8;

  padding: 45px;
}


/* ================================
   MODAL
================================ */

.modal {
  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, 0.48);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  -webkit-backdrop-filter: blur(5px);
}


.modal.hidden {
  display: none;
}


.modal-card {

  width: 100%;

  background: rgba(255, 255, 255, 0.10);

  border: 1px solid rgba(255, 255, 255, 0.20);

  border-radius: 22px;

  padding: 28px;

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.30),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);

}


.modal-card h2 {
  margin-top: 0;
}


.modal-card p {
  color: #d0d8e4;

  line-height: 1.5;
}


.modal-card button {
  width: 100%;

  margin-top: 12px;
}


.full-input {

  padding: 15px;

  border-radius: 12px;

  border: 1px solid rgba(255, 255, 255, 0.18);

  background: rgba(255, 255, 255, 0.07);

  color: white;

  outline: none;

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

/* ================================

================================ */

body.light {

  color: #111827;
}


body.light::before {

/* ================================

@media (max-width: 800px) {

  }

<script>
/* INTERNAL JS: js/place.js */
/* =====================================================
   KOLKATA TOURIST GUIDE
   PLACE PAGE CONTROLLER
   GOOGLE MAPS + MY LOCATION
===================================================== */

"use strict";

let places = [];
let currentPlace = null;


/* =====================================================
   LOAD PLACE DATA
===================================================== */

async function loadPlace() {

    const card = document.getElementById("placeCard");

    try {

        const response = await fetch(
            "data/places.json",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            throw new Error(
                "Could not load data/places.json"
            );

        }

        const data = await response.json();

        if (!Array.isArray(data)) {

            throw new Error(
                "places.json must contain an array"
            );

        }

        places = data;


        /* ---------------------------------------------
           GET PLACE ID
        --------------------------------------------- */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const id =
            params.get("id") ||
            params.get("place");


        /* ---------------------------------------------
           FIND CURRENT PLACE
        --------------------------------------------- */

        currentPlace =
            places.find(function (place) {

                return String(place.id) ===
                    String(id);

            });


        if (!currentPlace) {

            if (card) {

                card.innerHTML = `
                    <div style="
                        padding:40px;
                        text-align:center;
                    ">

                        <h2>
                            ❌ Tourist place not found
                        </h2>

                        <p>
                            Please go back and select
                            a tourist place again.
                        </p>

                    </div>
                `;

            }

            return;
        }


        /* ---------------------------------------------
           SAVE CURRENT PLACE
        --------------------------------------------- */

        window.currentPlace =
            currentPlace;


        localStorage.setItem(
            "currentPlaceId",
            currentPlace.id
        );


        localStorage.setItem(
            "currentPlace",
            currentPlace.name || ""
        );


        /* ---------------------------------------------
           PAGE TITLE
        --------------------------------------------- */

        document.title =
            (currentPlace.name || "Place") +
            " | Kolkata Tourist Guide";


        /* ---------------------------------------------
           RENDER
        --------------------------------------------- */

        renderPlace();

    }

    catch (error) {

        console.error(
            "PLACE LOAD ERROR:",
            error
        );


        if (card) {

            card.innerHTML = `
                <div style="
                    padding:40px;
                    text-align:center;
                ">

                    <h2>
                        ⚠️ Could not load place
                    </h2>

                    <p>
                        ${esc(error.message)}
                    </p>

                </div>
            `;

        }

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   INFORMATION BOX
===================================================== */

function infoBox(title, value) {

    return `
        <div class="info-box">

            <span>
                ${esc(title)}
            </span>

            <strong>
                ${
                    value !== undefined &&
                    value !== null &&
                    String(value).trim() !== ""
                        ? value
                        : "Not added yet"
                }
            </strong>

        </div>
    `;

}


/* =====================================================
   RENDER PLACE
===================================================== */

function renderPlace() {

    const card =
        document.getElementById(
            "placeCard"
        );


    if (!card) {
        return;
    }


    /* ---------------------------------------------
       IMAGE
    --------------------------------------------- */

    const imageHTML =

        currentPlace.image

            ? `
                <img
                    src="${esc(currentPlace.image)}"
                    alt="${esc(currentPlace.name)}"
                    style="
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        border-radius:17px;
                    "
                >
            `

            : `
                <div style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    height:100%;
                    font-size:24px;
                    font-weight:bold;
                ">
                    ${esc(currentPlace.name)}
                </div>
            `;


    /* ---------------------------------------------
       ATTRACTIONS
    --------------------------------------------- */

    let attractions = "";


    if (
        Array.isArray(
            currentPlace.attractions
        )
    ) {

        attractions =
            currentPlace.attractions.join(", ");

    }

    else {

        attractions =
            currentPlace.attractions || "";

    }


    /* ---------------------------------------------
       PLACE CARD
    --------------------------------------------- */

    card.innerHTML = `

        <div class="place-photo">

            ${imageHTML}

        </div>


        <div class="place-info">

            <p class="eyebrow">
                PLACE INFORMATION
            </p>


            <h1>
                ${esc(currentPlace.name)}
            </h1>


            <p>
                ${esc(
                    currentPlace.shortInfo ||
                    currentPlace.description ||
                    ""
                )}
            </p>


            <div class="info-grid">

                ${infoBox(
                    "Metro Station",
                    currentPlace.metroStation ||
                    currentPlace.metro
                )}


                ${infoBox(
                    "Opening Hours",
                    currentPlace.openingHours
                )}


                ${infoBox(
                    "Closing Day",

/* =====================================================
   GET PLACE COORDINATES
===================================================== */

function getPlaceCoordinates() {

    if (!currentPlace) {
        return null;
    }


    /* ---------------------------------------------
       FORMAT 1
    --------------------------------------------- */

    const latitude =
        parseFloat(
            currentPlace.latitude
        );


    const longitude =
        parseFloat(
            currentPlace.longitude
        );


    if (
        Number.isFinite(latitude) &&
        Number.isFinite(longitude)
    ) {

        return {

            latitude:
                latitude,

            longitude:
                longitude

        };

    }


    /* ---------------------------------------------
       FORMAT 2
    --------------------------------------------- */

    if (
        currentPlace.coordinates
    ) {

        const latitude2 =
            parseFloat(
                currentPlace.coordinates.latitude
            );


        const longitude2 =
            parseFloat(
                currentPlace.coordinates.longitude
            );


        if (
            Number.isFinite(latitude2) &&
            Number.isFinite(longitude2)
        ) {

            return {

                latitude:
                    latitude2,

                longitude:
                    longitude2

            };

        }

    }


    return null;

}

/* =====================================================
   JOIN CHAT
===================================================== */

function joinChat() {

    const input =
        document.getElementById(
            "nameInput"
        );


    if (!input) {

        alert(
            "Name input was not found."
        );

        return;

    }


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "Please enter your name."
        );

        return;

    }


    sessionStorage.setItem(
        "chatName",
        name
    );


    sessionStorage.setItem(
        "chatPlace",
        currentPlace.id
    );


    window.location.href =
        "chat.html?place=" +
        encodeURIComponent(
            currentPlace.id
        );

}


/* =====================================================
   OPEN TOURIST PLACE IN GOOGLE MAPS
===================================================== */

function openPlaceInGoogleMaps() {

    if (!currentPlace) {

        alert(
            "Place information is still loading."
        );

        return;

    }


    const coordinates =
        getPlaceCoordinates();


    /* ---------------------------------------------
       USE COORDINATES
    --------------------------------------------- */

    if (coordinates) {

        const url =
            "https://www.google.com/maps/search/?api=1" +
            "&query=" +
            encodeURIComponent(
                coordinates.latitude +
                "," +
                coordinates.longitude
            );


        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );


        return;

    }

    


    /* ---------------------------------------------
       GOOGLE MAPS URL
    --------------------------------------------- */

    if (
        currentPlace.googleMaps
    ) {

        window.open(
            currentPlace.googleMaps,
            "_blank",
            "noopener,noreferrer"
        );


        return;

    }


    /* ---------------------------------------------
       LOCATION URL
    --------------------------------------------- */

    if (
        currentPlace.location
    ) {

        window.open(
            currentPlace.location,
            "_blank",
            "noopener,noreferrer"
        );


        return;

    }


    alert(
        "Tourist place location is not available yet."
    );

}


/* =====================================================
   MY LOCATION
   GOOGLE MAPS:
   
   MY LOCATION
        ↓
   CURRENT TOURIST PLACE

   IMPORTANT:
   এখানে origin পাঠানো হচ্ছে না।

   Google Maps নিজেই user's
   current location ব্যবহার করবে.
===================================================== */

function getMyLocationAndRoute() {

    if (!currentPlace) {

        alert(
            "Place information is still loading."
        );

        return;

    }


    /* ---------------------------------------------
       CHECK BROWSER SUPPORT
    --------------------------------------------- */

    if (!navigator.geolocation) {

        alert(
            "Your browser does not support location."
        );

        return;

    }


    /* ---------------------------------------------
       CHECK DESTINATION
    --------------------------------------------- */

    const destination =
        getPlaceCoordinates();


    if (!destination) {

        alert(
            "Tourist place coordinates are not available yet."
        );

        return;

    }


    /* ---------------------------------------------
       BUTTON
    --------------------------------------------- */

    const button =
        document.getElementById(
            "distanceBtn"
        );


    if (button) {

        button.disabled = true;

        button.innerHTML =
            "📍 Opening Google Maps...";

    }


    /* ---------------------------------------------
       OPTIONAL:
       GET GPS PERMISSION FIRST

       We only use this to make sure the
       browser has location permission.

       We DO NOT put these coordinates
       into the Google Maps origin.
    --------------------------------------------- */

    navigator.geolocation.getCurrentPosition(

        function (position) {

            const userLat =
                position.coords.latitude;


            const userLng =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;


            console.log(
                "MY LOCATION LAT:",
                userLat
            );


            console.log(
                "MY LOCATION LNG:",
                userLng
            );


            console.log(
                "GPS ACCURACY:",
                accuracy,
                "meters"
            );


            /* -----------------------------------------
               SAVE USER LOCATION
            ----------------------------------------- */

            sessionStorage.setItem(
                "userLat",
                String(userLat)
            );


            sessionStorage.setItem(
                "userLng",
                String(userLng)
            );


            sessionStorage.setItem(
                "userAccuracy",
                String(accuracy)
            );


            /* -----------------------------------------
               DESTINATION

               IMPORTANT:
               NAME পাঠানো হচ্ছে যাতে Google Maps
               "Victoria Memorial" দেখায়।

               Example:
               My Location → Victoria Memorial
            ----------------------------------------- */

            const destinationName =
                currentPlace.name;


            /* -----------------------------------------
               GOOGLE MAPS DIRECTIONS URL

               IMPORTANT:
               এখানে কোনো origin নেই।

               Google Maps:
               My Location → Tourist Place
            ----------------------------------------- */

            const routeURL =
                "https://www.google.com/maps/dir/?api=1" +
                "&destination=" +
                encodeURIComponent(
                    destinationName
                ) +
                "&travelmode=driving";


            console.log(
                "GOOGLE MAPS ROUTE:",
                routeURL
            );


            /* -----------------------------------------
               OPEN GOOGLE MAPS
            ----------------------------------------- */

            window.open(
                routeURL,
                "_blank"
            );


            /* -----------------------------------------
               RESET BUTTON
            ----------------------------------------- */

            if (button) {

                button.disabled = false;

                button.innerHTML =
                    "📍 My Location";

            }

        },


        /* ---------------------------------------------
           GPS ERROR
        --------------------------------------------- */

        function (error) {

            console.error(
                "GPS ERROR:",
                error
            );


            if (button) {

                button.disabled = false;

                button.innerHTML =
                    "📍 My Location";

            }


            if (error.code === 1) {

                alert(
                    "Location permission denied.\n\n" +
                    "Chrome-এ Location → Allow করে আবার চেষ্টা করো."
                );

            }

            else if (error.code === 2) {

                alert(
                    "Current location পাওয়া যাচ্ছে না.\n\n" +
                    "Windows Location Services ON করো."
                );

            }

            else if (error.code === 3) {

                alert(
                    "GPS location পেতে সময় বেশি লাগছে.\n\n" +
                    "আবার চেষ্টা করো."
                );

            }

            else {

                alert(
                    "Could not get your current location."
                );

            }

        },


        /* ---------------------------------------------
           GPS OPTIONS
        --------------------------------------------- */

        {
            enableHighAccuracy: true,
            timeout: 30000,
            maximumAge: 0
        }

    );

}


/* =====================================================
   SHARE
===================================================== */

async function sharePlace() {

    if (!currentPlace) {
        return;
    }


    const url =
        window.location.href;


    /* ---------------------------------------------
       NATIVE SHARE
    --------------------------------------------- */

    if (
        navigator.share
    ) {

        try {

            await navigator.share({

                title:
                    currentPlace.name,

                text:
                    "Explore " +
                    currentPlace.name,

                url:
                    url

            });

        }

        catch (error) {

            console.log(
                "Share cancelled:",
                error
            );

        }


        return;

    }


    /* ---------------------------------------------
       CLIPBOARD
    --------------------------------------------- */

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        try {

            await navigator.clipboard.writeText(
                url
            );


            alert(
                "Place link copied."
            );

        }

        catch (error) {

            console.error(
                error
            );


            alert(
                "Could not copy place link."
            );

        }


        return;

    }


    alert(
        "Sharing is not supported in this browser."
    );

}


/* =====================================================
   THEME
===================================================== */

function setupTheme() {

    const themeBtn =
        document.getElementById(
            "themeBtn"
        );


    if (!themeBtn) {
        return;
    }


    themeBtn.addEventListener(
        "click",
        function () {

            document.body.classList.toggle(
                "light"
            );


            const theme =
                document.body.classList.contains(
                    "light"
                )
                    ? "light"
                    : "dark";


            localStorage.setItem(
                "theme",
                theme
            );

        }
    );


    if (
        localStorage.getItem(
            "theme"
        ) === "light"
    ) {

        document.body.classList.add(
            "light"
        );

    }

}

   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        setupTheme();

        loadPlace();

    }
);

window.openPlaceInGoogleMaps =
