<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Location | Kolkata Tourist Guide</title>
  <style>
/* INTERNAL CSS: css/style.css */
css
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;

  font-family: Arial, Helvetica, sans-serif;

  background: #090d14;

  color: #f5f7fb;

  position: relative;

  min-height: 100vh;
}


/* ================================
   GLOBAL KOLKATA BACKGROUND
   IMAGE LINK UNCHANGED
================================ */

body::before {
  content: "";

  position: fixed;

  inset: 0;

  z-index: -2;

  background:
    linear-gradient(
      rgba(4, 8, 15, 0.16),
      rgba(4, 8, 15, 0.22)
    ),
    url("https://images.pexels.com/photos/16569842/pexels-photo-16569842.jpeg")
    center center / cover no-repeat;

  pointer-events: none;
}


/* ================================
   TOP BAR
================================ */

.topbar {
  height: 58px;

  background: rgba(17, 26, 39, 0.30);

  backdrop-filter: blur(14px) saturate(115%);
  -webkit-backdrop-filter: blur(14px) saturate(115%);

  border-bottom: 1px solid rgba(255, 255, 255, 0.16);

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 5%;

  position: sticky;

  top: 0;

  z-index: 20;
}


.brand {
  font-weight: 800;

  font-size: 18px;
}


.brand span {
  color: #0b5bee;
}


.brand small {
  display: block;

  color: #e22a32;

  font-size: 9px;

  font-style: italic;

  margin-left: 25px;
}


/* ================================
   BUTTONS
================================ */

.icon-btn,
.secondary,
.primary {
  border: 1px solid rgba(255, 255, 255, 0.18);

  border-radius: 14px;

  background: rgba(255, 255, 255, 0.07);

  color: inherit;

  padding: 11px 17px;

  cursor: pointer;

  transition: 0.2s ease;

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}


.icon-btn:hover,
.secondary:hover {
  border-color: #3478f6;

  background: rgba(255, 255, 255, 0.12);

  transform: translateY(-1px);
}


.primary {
  background: #2169ee;

  border-color: #2169ee;

  color: white;

  font-weight: 700;
}


.primary:hover {
  background: #3478f6;
}


/* ================================
   HERO
   IMAGE LINK UNCHANGED
================================ */

.hero {
  min-height: 475px;

  background:
    linear-gradient(
      90deg,
      rgba(3, 7, 12, 0.28),
      rgba(3, 7, 12, 0.08)
    ),
    url("https://images.pexels.com/photos/16569842/pexels-photo-16569842.jpeg")
    center / cover no-repeat;

  display: flex;

  align-items: center;

  position: relative;
}


.hero-overlay {
  max-width: 900px;

  width: 90%;

  margin: auto;
}


.eyebrow {
  color: #2e73f2;

  font-weight: 800;

  letter-spacing: 2px;

  font-size: 12px;
}


.hero h1 {
  font-size: 64px;

  line-height: 0.98;

  margin: 10px 0 20px;
}


.hero p:not(.eyebrow) {
  max-width: 610px;

  color: #e0e5ec;

  line-height: 1.5;
}


/* ================================
   SEARCH
================================ */

.search {
  background: rgba(255, 255, 255, 0.88);

  border-radius: 16px;

  padding: 5px;

  display: flex;

  max-width: 590px;

  margin-top: 28px;

  box-shadow:
    0 12px 35px rgba(0, 0, 0, 0.16);
}


.search input {
  flex: 1;

  border: 0;

  outline: 0;

  padding: 16px;

  background: transparent;

  font-size: 15px;
}


.search button {
  border: 0;

  border-radius: 12px;

  background: #2169ee;

  color: white;

  padding: 0 24px;

  font-weight: 700;

  cursor: pointer;
}


/* ================================
   PLACES SECTION
================================ */

.places-section {
  max-width: 1000px;

  margin: 55px auto;

  padding: 0 25px;
}


.places-section h2 {
  font-size: 30px;
}


/* ================================
   PLACE GRID
================================ */

.place-grid {
  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 16px;
}


/* ================================
   PLACE CARD
   GLASSMORPHISM
================================ */

.place-tile {
  background: rgba(255, 255, 255, 0.07);

  border: 1px solid rgba(255, 255, 255, 0.18);

  border-radius: 16px;

  overflow: hidden;

  cursor: pointer;

  transition: 0.2s ease;

  backdrop-filter: blur(12px) saturate(115%);
  -webkit-backdrop-filter: blur(12px) saturate(115%);

  box-shadow:
    0 12px 35px rgba(0, 0, 0, 0.16),
    inset 0 1px 0 rgba(255, 255, 255, 0.10);
}


.place-tile:hover {
  transform: translateY(-3px);

  border-color: #3478f6;

  background: rgba(255, 255, 255, 0.10);
}


/* ================================
   PLACE IMAGE
================================ */

.place-img {
  width: 100%;

  height: 180px;

  background:
    linear-gradient(
      135deg,
      #21324b,
      #0d1420
    );

  display: flex;

  align-items: center;

  justify-content: center;

  color: #7d8da5;

  text-align: center;

  padding: 0;

  overflow: hidden;
}


.place-img img {
  width: 100%;

  height: 100%;

  display: block;

  object-fit: cover;
}


/* ================================
   PLACE TEXT
================================ */

.place-tile h3 {
  font-size: 16px;

  margin: 15px 14px 6px;
}


.place-tile p {
  font-size: 13px;

  color: #d0d8e4;

  margin: 0 14px 16px;

  line-height: 1.5;
}


/* ================================
   FOOTER
================================ */

footer {
  text-align: center;

  color: #b0bac8;

  padding: 45px;
}


/* ================================
   MODAL
================================ */

.modal {
  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, 0.48);

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  z-index: 100;

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}


.modal.hidden {
  display: none;
}


.modal-card {
  max-width: 430px;

  width: 100%;

  background: rgba(255, 255, 255, 0.10);

  border: 1px solid rgba(255, 255, 255, 0.20);

  border-radius: 22px;

  padding: 28px;

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.30),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);

  backdrop-filter: blur(18px) saturate(115%);
  -webkit-backdrop-filter: blur(18px) saturate(115%);
}


.modal-card h2 {
  margin-top: 0;
}


.modal-card p {
  color: #d0d8e4;

  line-height: 1.5;
}


.modal-card button {
  width: 100%;

  margin-top: 12px;
}


.full-input {
  width: 100%;

  padding: 15px;

  border-radius: 12px;

  border: 1px solid rgba(255, 255, 255, 0.18);

  background: rgba(255, 255, 255, 0.07);

  color: white;

  outline: none;

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}


/* ================================
   LIGHT MODE
   IMAGE LINK UNCHANGED
================================ */

body.light {
  background: #f5f7fb;

  color: #111827;
}


body.light::before {
  background:
    linear-gradient(
      rgba(245, 247, 251, 0.20),
      rgba(245, 247, 251, 0.30)
    ),
    url("https://images.pexels.com/photos/16569842/pexels-photo-16569842.jpeg")
    center / cover no-repeat;
}


body.light .topbar {
  background: rgba(255, 255, 255, 0.28);

  color: #111827;

  border-bottom-color: rgba(255, 255, 255, 0.60);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}


body.light .place-tile,
body.light .modal-card {
  background: rgba(255, 255, 255, 0.20);

  border-color: rgba(255, 255, 255, 0.55);

  box-shadow:
    0 12px 35px rgba(0, 0, 0, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.70);
}


body.light .secondary,
body.light .icon-btn {
  background: rgba(255, 255, 255, 0.25);

  color: #111827;

  border-color: rgba(255, 255, 255, 0.60);
}


body.light .place-tile p {
  color: #4b5563;
}


body.light .modal-card p {
  color: #4b5563;
}


body.light .full-input {
  background: rgba(255, 255, 255, 0.28);

  color: #111827;

  border-color: rgba(255, 255, 255, 0.60);
}


/* ================================
   TABLET
================================ */

@media (max-width: 800px) {

  .place-grid {
    grid-template-columns: repeat(2, 1fr);
  }


  .hero h1 {
    font-size: 45px;
  }
}


/* ================================
   MOBILE
================================ */

@media (max-width: 520px) {

  .place-grid {
    grid-template-columns: 1fr;
  }


  .topbar {
    padding: 0 18px;
  }


  .brand {
    font-size: 15px;
  }


  .hero {
    min-height: 500px;
  }


  .hero-overlay {
    width: 88%;
  }


  .hero h1 {
    font-size: 42px;
  }


  .search {
    width: 100%;
  }


  .place-img {
    height: 210px;
  }
}


</style>
  <style>
/* INTERNAL CSS: css/map.css */
.map-page{max-width:1000px;margin:25px auto;padding:0 15px}.map-notice{background:#111a27;border:1px solid #273448;border-radius:18px;padding:20px;margin-bottom:15px}.map-notice p{color:#aab5c5}.map-canvas{height:65vh;min-height:450px;border-radius:22px;position:relative;overflow:hidden;background:#d7eadf}.map-grid{position:absolute;inset:0;background-image:linear-gradient(25deg,transparent 48%,#a8b8c4 49%,#a8b8c4 51%,transparent 52%),linear-gradient(90deg,transparent 48%,#b7c8d2 49%,#b7c8d2 51%,transparent 52%);background-size:180px 180px;opacity:.7}.map-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:white;color:#475569;padding:14px 18px;border-radius:14px;box-shadow:0 5px 20px #0002}.marker{position:absolute;transform:translate(-50%,-100%);text-align:center;font-weight:700}.pin{width:18px;height:18px;border-radius:50%;background:#2169ee;border:3px solid white;box-shadow:0 2px 8px #0005;margin:auto}.marker-label{background:white;color:#111827;padding:5px 9px;border-radius:10px;margin-top:3px;white-space:nowrap}.status{margin-top:12px;background:#111a27;border:1px solid #273448;border-radius:14px;padding:14px;color:#aab5c5}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Live Location</div>
  <button class="secondary" onclick="history.back()">← Back</button>
</header>
<main class="map-page">
  <div class="map-notice">
    <h2>Group Live Location</h2>
    <p>Members of the same chat group can appear here when they share their browser location.</p>
  </div>
  <div id="mapCanvas" class="map-canvas">
    <div class="map-grid"></div>
    <div id="markers"></div>
    <div class="map-center">Map area — connect a map provider here</div>
  </div>
  <div id="locationStatus" class="status">Requesting your location…</div>
</main>
<script src="github-pages.js"></script>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
/* INTERNAL JS: js/map.js */
const socket=io();
const params=new URLSearchParams(location.search);
const groupId=params.get("group")||"group";
const name=sessionStorage.getItem("chatName");
const markers=document.getElementById("markers");
const positions=new Map();

function addMarker(m){
  positions.set(m.id,m);
  renderMarkers();
}
function renderMarkers(){
  markers.innerHTML="";
  [...positions.values()].forEach((m,i)=>{
    const el=document.createElement("div");
    el.className="marker";
    el.style.left=(30+(i*23)%55)+"%";
    el.style.top=(35+(i*17)%45)+"%";
    el.innerHTML=`<div class="pin"></div><div class="marker-label">${escapeHtml(m.name)}</div>`;
    markers.appendChild(el);
  });
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
socket.emit("joinGroup",{groupId,name});
socket.on("locationUpdate",addMarker);

if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    socket.emit("locationUpdate",{groupId,name,lat:pos.coords.latitude,lng:pos.coords.longitude});
    document.getElementById("locationStatus").textContent="Your live location is being shared with this group.";
  },()=>{
    document.getElementById("locationStatus").textContent="Location permission was not granted.";
  },{enableHighAccuracy:true,maximumAge:5000,timeout:10000});
}else{
  document.getElementById("locationStatus").textContent="This browser does not support location.";
}
</script>
</body>
</html>
